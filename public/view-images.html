      color: #0f172a;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .info {
      padding: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
